name: CI

# Qualitaets-Gate fuer geldbewegenden Code: typecheck + Unit-Tests sind das
# DETERMINISTISCHE Hard-Gate (kein Env noetig, schuetzt die Ledger-Invarianten).
# Der Build laeuft mit Platzhalter-Env; fuer volle Treue koennen echte Werte als
# Repository-Secrets gesetzt werden. ESLint ist (noch) nicht app-seitig
# konfiguriert -> bewusst kein `next lint`-Schritt (wuerde sonst interaktiv haengen).

on:
  push:
    branches: [main, feat/payment, feat/scoring-observability]
  pull_request:
    branches: [main, feat/payment, feat/scoring-observability]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (blocking)
        run: npm run typecheck

      - name: Unit tests — money-moving logic (blocking)
        run: npm run test

      - name: Build (placeholder env)
        run: npm run build
        env:
          PAYMENTS_ENABLED: "off"
          GOOGLE_GENAI_API_KEY: "ci-placeholder"
          GEMINI_API_KEY: "ci-placeholder"
          GOOGLE_API_KEY: "ci-placeholder"
          NEXTAUTH_SECRET: "ci-placeholder-secret-0000000000000000"
          NEXTAUTH_URL: "http://localhost:9002"

  # §2.3 (Master-Blueprint): Golden-Set als BLOCKIERENDES Gate — misst den
  # ECHTEN Kompetenz-Generator (scoreCompetencies + quality-core-Checks) gegen
  # scripts/quality/golden-set.json. Kosten: wenige Cent/Lauf (Owner-OK
  # 2026-07-13). LLM-Läufe sind stochastisch → genau EIN Retry faengt
  # Einzel-Flakes ab (gelebte Praxis vom Studio-Gate); zweimal rot = echt rot.
  golden-set:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Golden-Set-Regression (blocking, 1 Retry)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_GENAI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run quality:regression || npm run quality:regression
