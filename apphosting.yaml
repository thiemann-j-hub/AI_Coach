runConfig:
  minInstances: 0

env:
  # non-secret config
  - variable: GEMINI_TEXT_MODEL
    value: "gemini-2.5-flash"
  - variable: PINECONE_INDEX_HOST
    value: "script-coach-cards-fcudb5g.svc.gcp-europe-west4-de1d.pinecone.io"
  - variable: PINECONE_NAMESPACE
    value: "cards_v3"

  # Firebase Client Config (Required for Build & Runtime)
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyC7lKS5kXoHrd6T7psXSG6dyAQBXXNBQuo"
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "ai-coach-c343f.firebaseapp.com"
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "ai-coach-c343f"
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "ai-coach-c343f.firebasestorage.app"
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "565409632174"
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:565409632174:web:9ab7f765283c72e73c423f"
  - variable: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
    value: "G-Q9C1NY2JVD"

  # Branding in generierten LinkedIn-Posts/-Bildern ("" = neutral, keine Erwaehnung)
  - variable: LINKEDIN_BRAND_NAME
    value: "Pulscraft AI"

  # secrets (Cloud Secret Manager)
  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY

  - variable: PINECONE_API_KEY
    secret: PINECONE_API_KEY
  - variable: SERVICE_ACCOUNT_JSON
    secret: FIREBASE_SERVICE_ACCOUNT_JSON

  # LinkedIn OAuth — Secrets existieren mit Whitespace-Platzhalter (= App meldet
  # "nicht konfiguriert"). Echte Werte aus https://www.linkedin.com/developers/apps
  # setzen mit:
  #   firebase apphosting:secrets:set LINKEDIN_CLIENT_ID
  #   firebase apphosting:secrets:set LINKEDIN_CLIENT_SECRET
  # Redirect-URI wird aus dem Request-Origin abgeleitet; in der LinkedIn-App
  # https://<prod-domain>/api/linkedin/callback als Redirect-URL eintragen.
  - variable: LINKEDIN_CLIENT_ID
    secret: LINKEDIN_CLIENT_ID
  - variable: LINKEDIN_CLIENT_SECRET
    secret: LINKEDIN_CLIENT_SECRET
