name: Deploy to Azure App Service

# CI-Umstellung 09.08.2026 (Vorbild: ai-elearning-studio/azure-deploy.yml).
# Grund: lokale Builds scheitern regelmäßig am 7,3-GB-RAM-Engpass des Laptops
# (OOM-Exit 3221226505 am 08.08.); das Studio deployt seit W19 fehlerfrei über
# diesen Weg. Auth per Publish-Profile (Secret AZURE_WEBAPP_PUBLISH_PROFILE).
# basePath /coach ist der Default in next.config.ts — wird hier trotzdem
# explizit gebacken (NEXT_PUBLIC_* = build-time-inlined, W19-PC-1-Lehre).

on:
  push:
    branches: [feat/scoring-observability]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # O4 Bündel-Frische (Blueprint COACH-OPTIMIERUNG 27.09.): Der Client trägt
      # seine Build-SHA eingebacken (NEXT_PUBLIC_BUILD_SHA) und vergleicht sie mit
      # public/build-info.json des laufenden Servers — weicht sie ab, lädt ein
      # offener Tab beim nächsten Seitenwechsel neu, statt mit altem Bündel gegen
      # neue Routen zu laufen (Falle vom 25./26.09.).
      - name: Stamp build info (public/build-info.json)
        run: |
          mkdir -p public
          printf '{"sha":"%s","branch":"%s","builtAt":"%s"}' \
            "${GITHUB_SHA::7}" "${GITHUB_REF_NAME}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > public/build-info.json
          cat public/build-info.json

      - name: Build (Next.js standalone)
        env:
          NEXT_PUBLIC_BASE_PATH: /coach
          NEXT_PUBLIC_BUILD_SHA: ${{ github.sha }}
          NODE_OPTIONS: "--max-old-space-size=6144"
        run: npm run build

      # Retrieval-Gate (Gemini-Vorgabe zu V1, Owner-GO 25.09.2026): der echte
      # Kundenfilter muss gegen die Karten-DB Treffer liefern (de + en + Coach-
      # Pause) und alle Treffer müssen 'published' sein (E-4). Sonst KEIN Deploy —
      # der Filterfehler N4-76 blieb monatelang unbemerkt, weil nichts ihn maß.
      - name: Retrieval-Gate — Kundenweg muss Karten liefern
        env:
          COSMOS_ENDPOINT: ${{ secrets.COSMOS_ENDPOINT }}
          COSMOS_KEY: ${{ secrets.COSMOS_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run verify:retrieval

      - name: Assemble standalone bundle
        run: |
          # Next standalone enthält .next/static + public NICHT — reinkopieren.
          cp -r .next/static .next/standalone/.next/static
          if [ -d public ]; then cp -r public .next/standalone/public; fi
          printf '{"sha":"%s","branch":"%s","builtAt":"%s"}' \
            "${GITHUB_SHA::7}" "${GITHUB_REF_NAME}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > .next/standalone/build-info.json
          cat .next/standalone/build-info.json

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: pulsecraft-coach
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .next/standalone

      - name: Post-Deploy Smoke — /coach-Seite muss laden
        run: |
          BASE="https://pulsecraft-coach.azurewebsites.net"
          for i in $(seq 1 15); do
            sleep 10
            page=$(curl -s -o /dev/null -w "%{http_code}" -L "$BASE/coach" || echo 000)
            echo "try $i: /coach=$page"
            if [ "$page" = "200" ]; then echo "✓ Coach live"; exit 0; fi
          done
          echo "✗ Smoke fehlgeschlagen (zuletzt $page)"; exit 1
